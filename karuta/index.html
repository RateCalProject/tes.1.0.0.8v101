<!DOCTYPE html>
<html lang="ja" data-theme="ai" data-cstyle="plain" data-size="std">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>百人一首 かるた対戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
/* 配置: 上に詠み札パネル、下に札の場。色と書体はテーマ変数で切り替える（藍の夜・墨・畳・昼） */
:root{
  --bg:#0d1a35; --bgcol:#0d1a35; --bg2:#15264b; --panel:#1d3566;
  --tx:#f4f6fc; --tx2:#dde5f6; --mute:#b6c3e3; --line:rgba(255,255,255,.2); --inp:rgba(0,0,0,.3);
  --rd1:#1f3a70; --rd2:#142a55; --title:#f2ecdd;
  --shu:#e0442c; --kin:#ecc25e; --kjc:#ffd36b;
  --p1:#f0674d; --p2:#5ab4ff; --p3:#5ed08f; --p4:#f3c653;
  --card-bg:#f2ecdd; --card-ink:#101014; --card-edge:#b9a97e;
  --bgimg:radial-gradient(900px 520px at 85% -8%,rgba(224,68,44,.16),transparent 60%),radial-gradient(800px 480px at -10% 108%,rgba(90,180,255,.12),transparent 60%);
  --f-disp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --f-ui:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;
  --f-card:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --ts:1; --rh:154px;
  color-scheme:dark;
}
:root[data-theme="sumi"]{--bg:#09090c;--bgcol:#09090c;--bg2:#15151b;--panel:#22222c;--rd1:#1d1d27;--rd2:#14141b;--line:rgba(255,255,255,.22);
  --bgimg:radial-gradient(900px 520px at 85% -8%,rgba(224,68,44,.12),transparent 60%)}
:root[data-theme="tatami"]{--bg:#2d3a1d;--bgcol:#41532a;--bg2:#27331a;--panel:#34452a;--rd1:#27351b;--rd2:#1d2814;--line:rgba(255,255,255,.24);--mute:#d1dbbd;--tx2:#eef3e2;
  --bgimg:repeating-linear-gradient(90deg,transparent 0 238px,rgba(14,20,6,.55) 238px 242px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,rgba(0,0,0,.05) 2px 4px),linear-gradient(180deg,#4a5e2f,#38491f)}
:root[data-theme="hiru"]{--bg:#efe9db;--bgcol:#efe9db;--bg2:#fbf8f0;--panel:#ffffff;--tx:#17171d;--tx2:#2b2d38;--mute:#555a6e;--line:rgba(0,0,0,.2);--inp:#ffffff;
  --rd1:#fffdf6;--rd2:#f3ead3;--title:#17171d;--kin:#8a5a00;--kjc:#b3261e;--shu:#c8321b;
  --bgimg:radial-gradient(900px 520px at 85% -8%,rgba(224,68,44,.10),transparent 60%);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bgcol);background-image:var(--bgimg);color:var(--tx);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input{user-select:text;-webkit-user-select:text}
:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- ホーム ---------- */
.home{max-width:640px;margin:0 auto;padding:20px 18px 36px;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;gap:14px;align-items:stretch}
.titlebox{display:flex;gap:6px;flex:none}
.titlebox h1{margin:0;writing-mode:vertical-rl;font-family:var(--f-disp);font-weight:800;
  font-size:clamp(52px,16vw,84px);line-height:1;letter-spacing:.1em;color:var(--title)}
.titlebox .sub{writing-mode:vertical-rl;font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.35em;
  color:#fff;background:var(--shu);padding:10px 5px;align-self:flex-start;margin-top:6px;border-radius:2px}
.menu{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.menu button{display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:center;text-align:left;
  padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.menu button i{grid-row:1/3;font-style:normal;font-family:var(--f-disp);font-weight:800;font-size:26px;color:var(--shu);text-align:center}
.menu button b{font-size:17px;font-weight:700;color:var(--tx)}
.menu button small{color:var(--mute);font-size:13px;line-height:1.35}
.menu button:active{transform:translateY(1px)}
.menu button:disabled{opacity:.5;cursor:not-allowed}
.today{border-top:1px solid var(--line);padding-top:16px}
.today h2{margin:0 0 10px;font-size:14px;letter-spacing:.2em;color:var(--kin);font-weight:700}
.today .au{font-size:14px;color:var(--mute)}
.today .k,.today .s{font-family:var(--f-card);font-size:21px;font-weight:700;margin:4px 0 0;letter-spacing:.06em;line-height:1.5}
.today .s{color:var(--title)}
.how{margin:0;font-size:15px;color:var(--mute)}

/* ---------- 共通 ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:linear-gradient(var(--bg) 72%,transparent);z-index:2}
.bar h2{margin:0;font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:.08em}
.back{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:15px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--tx2);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:500}
.chip.on{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
.chip:disabled{opacity:.45;cursor:not-allowed}
.btn{border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:700;background:var(--shu);color:#fff;letter-spacing:.1em}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--tx2);font-weight:500;letter-spacing:0;font-size:16px}
.btn:active{transform:translateY(1px)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}

/* ---------- 設定 ---------- */
.setup{max-width:640px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.sec h3{margin:0 0 10px;font-size:14px;letter-spacing:.18em;color:var(--kin)}
.slotrow{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.slotrow:first-of-type{border-top:0;padding-top:0}
.slotrow .who{display:flex;align-items:center;gap:10px;min-height:38px}
.slotrow input[type=text]{flex:1;min-width:0;background:var(--inp);border:1.5px solid var(--line);border-radius:8px;color:var(--tx);font:inherit;font-size:16px;padding:8px 10px}
.slotrow .lbl{font-weight:700}
.slotrow .mute{color:var(--mute);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.optrow{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.optrow .t{font-size:15px;color:var(--mute)}
.note{margin:0;font-size:14px;color:var(--mute)}
.lvrow{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.lvrow .step{height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:22px;font-weight:700}
.lvrow input[type=range]{width:100%;accent-color:var(--shu);height:32px}
.lvtxt{font-family:var(--f-disp);font-weight:800;font-size:19px;color:var(--tx)}
.lvtxt small{font-family:var(--f-ui);font-weight:500;font-size:14px;color:var(--mute);margin-left:8px}
.prog{height:10px;border-radius:99px;background:var(--inp);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--p3),var(--kin))}
.pnum{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;color:var(--tx2)}
.pnum b{font-family:var(--f-disp);font-size:22px;color:var(--tx)}

/* ---------- 見た目設定 ---------- */
.pv{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 8px;border-radius:12px;background:var(--bgcol);background-image:var(--bgimg);border:1px solid var(--line)}
.pv .slot{width:84px;height:118px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:48px;height:48px;border-radius:12px;border:3px solid var(--line);background:var(--sw);position:relative;padding:0}
.sw.on{border-color:var(--shu);box-shadow:0 0 0 2px var(--bg2),0 0 0 5px var(--shu)}
.sw span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-weight:800;font-size:18px;color:var(--ink)}
.chip.cat{border-color:var(--cc);position:relative;padding-left:27px}
.chip.cat::before{content:'';position:absolute;left:11px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--cc)}
.chip.cat.on{background:var(--cc);color:var(--ci);border-color:var(--cc);font-weight:700}
.chip.cat.on::before{background:var(--ci)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--tx2)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;background:var(--cc);margin-right:6px;vertical-align:-2px}
.chip.f1{font-family:'Shippori Mincho B1','Hiragino Mincho ProN',serif;font-weight:700}
.chip.f2{font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;font-weight:700}
.chip.f3{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;font-weight:700}
.chip.f4{font-family:'Yuji Syuku','Hiragino Mincho ProN',serif}

/* ---------- 対戦画面 ---------- */
.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:8px 10px 10px;max-width:1000px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.round{font-family:var(--f-disp);font-weight:800;font-size:17px;color:var(--kin);letter-spacing:.08em}
.menubtn{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:14px}
.scores{display:flex;gap:6px}
.pchip{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;border-radius:10px;padding:4px 8px 5px;
  background:var(--bg2);border:2px solid transparent;border-left:6px solid var(--c)}
.pchip .nm{font-size:13px;font-weight:700;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.pchip .sc{font-family:var(--f-disp);font-size:24px;font-weight:800;line-height:1.1}
.pchip.floor{border-color:var(--c);background:var(--panel)}
.pchip.locked{opacity:.5}
.reader{height:var(--rh);flex:none;background:linear-gradient(160deg,var(--rd1),var(--rd2));border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;overflow:hidden;position:relative}
.rhead{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute);margin-bottom:2px;font-weight:700}
.rhead b{color:var(--kin);font-family:var(--f-disp);letter-spacing:.1em}
.kami{font-family:var(--f-card);font-weight:700;font-size:calc(clamp(23px,6.3vw,34px) * var(--ts));line-height:1.35;letter-spacing:.08em;min-height:2.7em;color:var(--tx)}
.kami .ph{display:inline-block;margin-right:.6em;white-space:nowrap}
.kami .c{opacity:0;transition:opacity .1s}
.kami .c.on{opacity:1}
.kami.hintk .c.kj{color:var(--kjc)}
.kami.hidden{visibility:hidden}
.listen{position:absolute;left:14px;right:14px;top:56px;text-align:center;color:var(--mute);font-size:16px}
.floorbar{position:absolute;left:0;bottom:0;height:5px;background:var(--c);width:100%;transform-origin:left;transition:transform .08s linear}
.res .k,.res .s{font-family:var(--f-card);font-weight:700;font-size:calc(clamp(15px,4.4vw,20px) * var(--ts));letter-spacing:.04em;line-height:1.42;color:var(--tx)}
.res .s{color:var(--title)}
.res .meta{font-size:calc(13.5px * var(--ts));color:var(--mute);margin-top:3px;line-height:1.4}
.res .meta em{font-style:normal;color:var(--kjc);font-weight:700}
.field{flex:1;min-height:0;display:grid;gap:5px;align-content:stretch;overflow:hidden;border-radius:10px;transition:box-shadow .15s}
.field.scrollmode{overflow-y:auto;align-content:start;-webkit-overflow-scrolling:touch}
.field.armed{box-shadow:0 0 0 3px var(--c)}
.slot{container-type:size;display:grid;place-items:center;min-width:0;min-height:0}

/* 札 */
.card{container-type:size;position:relative;height:min(100cqh,140cqw);width:min(100cqw,71.4cqh);background-color:var(--card-bg);color:var(--card-ink);
  border-radius:5px;box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.12);cursor:pointer;
  display:flex;justify-content:center;align-items:flex-start;transition:opacity .2s}
.card .t{writing-mode:vertical-rl;font-family:var(--f-card);font-weight:700;
  font-size:13px;font-size:min(calc(100cqh / 9.8),calc(100cqw / 3.4));line-height:1.45;padding-top:5cqh;white-space:nowrap;position:relative;z-index:1}
.card .t span{display:block}
.card .t .l2{margin-block-start:.9em}
.card:active{filter:brightness(.92)}
.card.dim{opacity:.3}
.card.wrong{pointer-events:none;opacity:.4;box-shadow:0 0 0 3px var(--shu)}
.card.gone{visibility:hidden;pointer-events:none}
.card.reveal{pointer-events:auto;box-shadow:0 0 0 4px var(--shu),0 0 18px var(--shu);animation:pulse 1s ease-in-out infinite}
.card.fade{pointer-events:none;opacity:0}
.card.deal{animation:deal .32s cubic-bezier(.2,.8,.3,1) both}
.card.miss{animation:shake .35s}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--shu),0 0 4px var(--shu)}}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
@keyframes deal{from{opacity:0;transform:translateY(-26px) rotate(-6deg) scale(.9)}to{opacity:1;transform:none}}
/* 札のスタイル */
:root[data-cstyle="double"] .card::after{content:'';position:absolute;inset:4%;border:1.6px solid var(--card-edge);border-radius:3px;pointer-events:none}
:root[data-cstyle="classic"] .card::before,:root[data-cstyle="classic"] .card::after{content:'';position:absolute;left:0;right:0;height:6%;opacity:.7;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--card-edge) 0 5px,transparent 5px 10px)}
:root[data-cstyle="classic"] .card::before{top:2%}
:root[data-cstyle="classic"] .card::after{bottom:2%}
:root[data-cstyle="grain"] .card{background-image:repeating-linear-gradient(97deg,rgba(0,0,0,.05) 0 1px,transparent 1px 5px),repeating-linear-gradient(8deg,rgba(255,255,255,.14) 0 1px,transparent 1px 9px)}
:root[data-cstyle="flat"] .card{box-shadow:none;border:2px solid var(--card-edge);border-radius:3px}
.pbar,.buzzers{display:flex;gap:8px;flex:none}
.bz{flex:1;min-width:0;height:62px;border:0;border-radius:14px;background:var(--c);color:#14141a;font-weight:700;font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.bz span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.bz kbd{font:500 11px var(--f-ui);opacity:.75}
.bz:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.bz:disabled{opacity:.3;box-shadow:none;cursor:default}
.pb{flex:1;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);font-size:15px;font-weight:700}
.pb.next{background:var(--shu);border-color:var(--shu);color:#fff;flex:1.4}
.pb:disabled{opacity:.35}

/* ---------- 結果 ---------- */
.result{max-width:560px;margin:0 auto;padding:26px 18px 40px;display:flex;flex-direction:column;gap:18px}
.result h2{margin:0;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,8vw,40px);letter-spacing:.08em;color:var(--title)}
.result .lead{text-align:center;color:var(--kin);font-size:14px;letter-spacing:.3em;margin:0}
.rank{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px}
.rrow .no{font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--kin);text-align:center}
.rrow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .sc{font-family:var(--f-disp);font-weight:800;font-size:30px}
.rrow.win{background:var(--panel);border-color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-disp);font-size:28px;font-weight:800;line-height:1.2}
.stat span{font-size:13px;color:var(--mute)}
.actions{display:flex;flex-direction:column;gap:10px}
details.log{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.log summary{cursor:pointer;font-weight:700}
.log ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.log li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-family:var(--f-card);font-size:16px;line-height:1.45}
.log li small{display:block;font-family:var(--f-ui);color:var(--mute);font-size:13px}

/* ---------- 一覧 ---------- */
.list{max-width:640px;margin:0 auto;padding:0 16px 40px}
.search{width:100%;background:var(--inp);border:1.5px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;font-size:16px;padding:10px 12px;margin-bottom:12px}
.li{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:12px 0 12px 10px;border-top:1px solid var(--line);border-left:6px solid var(--cc,transparent)}
.li .no{font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--shu);text-align:center}
.li .au{font-size:14px;color:var(--mute)}
.li .k,.li .s{font-family:var(--f-card);font-weight:700;font-size:18px;letter-spacing:.04em;line-height:1.45}
.li .s{color:var(--title)}
.li .kana{font-size:13.5px;color:var(--mute);margin-top:2px}
.li .kj{font-size:13.5px;color:var(--kin);font-weight:700}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.badge.ok{background:var(--p3);color:#0b2a17}
.badge.weak{background:var(--shu);color:#fff}

/* ---------- ダイアログ・演出 ---------- */
.modal{position:fixed;inset:0;background:rgba(4,9,22,.8);display:grid;place-items:center;z-index:60;padding:20px}
.dlg{width:min(360px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;color:var(--tx)}
.dlg h3{margin:0 0 4px;font-family:var(--f-disp);font-size:22px;letter-spacing:.1em;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:rgba(10,10,16,.9);
  border:1px solid rgba(255,255,255,.25);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.codebox{font-family:var(--f-disp);font-weight:800;font-size:clamp(48px,16vw,72px);letter-spacing:.22em;padding-left:.22em;color:var(--kin);line-height:1.2;user-select:text;-webkit-user-select:text}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx .card{position:fixed;margin:0;pointer-events:none;will-change:transform}
.fxring{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--c);pointer-events:none}

/* 決まり字: 与えた札の中で、上の句の最初の何文字で一つに決まるか */
function kimariji(nums){
  const out={},K={};
  for(const n of nums)K[n]=norm(P[n-1].kana);
  for(const n of nums){
    const a=K[n];let len=1;
    for(;len<a.length;len++){
      const pre=a.slice(0,len);
      if(!nums.some(m=>m!==n&&K[m].startsWith(pre)))break;
    }
    out[n]=len;
  }

let AC=null;
const sfxOn=()=>G?G.opts.sfx:setup.opts.sfx;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,type,g,delay){
  if(!sfxOn())return;const c=ac();if(!c)return;
  try{
    const t=c.currentTime+(delay||0),o=c.createOscillator(),gg=c.createGain();
    o.type=type||'sine';o.frequency.value=f;
    gg.gain.setValueAtTime(g||.12,t);gg.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gg);gg.connect(c.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
function noise(dur,ftype,freq,q,g,delay){
  if(!sfxOn())return;const c=ac();if(!c)return;
  try{
    const t=c.currentTime+(delay||0),n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=c.createBufferSource();s.buffer=buf;
    const f=c.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q;
    const gg=c.createGain();gg.gain.value=g;
    s.connect(f);f.connect(gg);gg.connect(c.destination);s.start(t);
  }catch(e){}
}
function sfx(k){
  if(k==='hit'){            /* ぱしっ（手が札を打つ）→ しゅっ（札がすべる）→ 小さな鈴 */
    noise(.07,'bandpass',2200,.9,.8);tone(120,.11,'sine',.4);
    noise(.3,'bandpass',4300,.6,.2,.05);
    tone(784,.1,'triangle',.06,.16);tone(1175,.2,'triangle',.06,.24);
  }else if(k==='ng'){noise(.12,'lowpass',520,.7,.55);tone(130,.28,'sawtooth',.08);}
  else if(k==='buz'){tone(540,.09,'square',.06);}
}

function speak(text,rate){

    speechSynthesis.cancel();

    const v=(speechSynthesis.getVoices()||[]).find(v=>v.lang&&v.lang.toLowerCase().startsWith('ja'));
    if(v)u.voice=v;

  }catch(e){}
}

    <section class="sec"><h3>出す範囲</h3>${ch('range',ranges)}<div class="optrow" style="padding-bottom:0"><span class="t">五色（各20首）。選ばなければ全部。数字は おぼえた/20</span>${catChipsHTML('prac',prac.cats,true)}</div>
      <p class="note" style="margin-top:8px">この範囲：${pool.length}首</p></section>
    <section class="sec"><h3>問題数と札の数</h3>
      <div class="optrow"><span class="t">問題数（1問に1首）</span>${ch('q',[[10,'10問'],[20,'20問'],[50,'50問'],[100,'100問']])}</div>
      <div class="optrow"><span class="t">場に並べる札（毎回入れかわります）</span>${ch('fs',[[4,'4枚'],[6,'6枚'],[8,'8枚'],[12,'12枚']])}</div>
      ${commonOptsHTML(false)}
      <p class="note">練習では百首すべてで数えた本当の決まり字が金色で出ます。そこまで聞けば取れる、という目安です。時間制限もお手つきの減点もありません。</p>
    </section>
    <button class="btn ghost" data-act="go-look">見た目を変える</button>
    <button class="btn" data-act="prac-start">${q}問ではじめる</button>
  </div></div>`;
}

/* ============================================================
   対戦の開始
   ============================================================ */
function startGame(){
  if(catPool(setup.cats).length<2){toast('選んだ歌が少なすぎます');return;}
  const act=setup.slots.map((s,i)=>({s,i})).filter(x=>x.s.kind!=='none');
  const hum=act.filter(x=>x.s.kind==='human').length,ais=act.length-hum;
  if(setup.mode==='ai'&&ais<1){toast('相手のAIを1人以上えらんでください');return;}
  if(setup.mode==='friend'&&hum<2){toast('「人」を2人以上にしてください');return;}
  saveSetup();
  const cnt={};act.forEach(x=>{if(x.s.kind==='ai')cnt[x.s.level]=(cnt[x.s.level]||0)+1;});
  const players=act.map((x,k)=>({
    id:k,slot:x.i,kind:x.s.kind,level:x.s.level,
    name:x.s.kind==='human'?(setup.names[x.i].trim()||`プレイヤー${x.i+1}`):`AI Lv${x.s.level}${cnt[x.s.level]>1?'-'+(x.i+1):''}`,
    color:`var(--p${x.i+1})`,score:0,locked:false,plan:null,done:false
  }));
  newGame(players);
}
function baseG(extra){
  return Object.assign({round:-1,phase:'idle',cur:null,t:0,shown:0,readDone:false,readEndT:0,spoke:false,
    floor:null,floorT:0,rt:0,log:[],paused:false,last:performance.now(),scrollMode:false,timer:null,tapAt:null,q:null,online:null},extra);
}
function warmUp(o){
  if(o.tts){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
  ac();
}
function newGame(players,cats,online){
  stopGame();
  cats=cats||setup.cats;
  const o={...setup.opts};
  const deck=shuffle(catPool(cats)).slice(0,o.cards);
  G=baseG({practice:false,players,opts:o,ci:SPEED[o.speed],deck,field:new Set(deck),fieldCount:deck.length,klen:kimariji(deck),
    humans:players.filter(p=>p.kind==='human').length,online:online||null});
  lastRun={type:'battle',players:players.map(p=>({...p})),cats:cats.slice()};
  warmUp(o);buildPlay();nextRound();G.timer=setInterval(tick,40);
  if(window.kzOnStart)try{window.kzOnStart(G);}catch(e){}   /* 風の芽経済組（kz.js） */
}
function startPractice(pool,q,fs){
  stopGame();
  const o={...setup.opts,hint:false};
  const deck=shuffle(pool).slice(0,Math.min(q,pool.length));
  const players=[{id:0,slot:0,kind:'human',name:'あなた',color:'var(--p1)',score:0,locked:false,plan:null,done:false}];
  G=baseG({practice:true,players,opts:o,ci:SPEED[o.speed],deck,field:new Set(),fieldCount:fs,klen:KJ_ALL,humans:1,
    pr:{correct:0,miss:0,streak:0,first:0,missed:[],early:0}});
  lastRun={type:'practice',pool:pool.slice(),q:deck.length,fs};
  warmUp(o);buildPlay();nextRound();G.timer=setInterval(tick,40);
}
function restartLast(){
  if(!lastRun)return showHome();
  if(lastRun.type==='practice')startPractice(lastRun.pool,lastRun.q,lastRun.fs);
  else newGame(lastRun.players.map(p=>({...p,score:0,locked:false,plan:null,done:false})),lastRun.cats);
}
function stopGame(){
  if(G&&G.timer)clearInterval(G.timer);
  stopSpeech();fx.innerHTML='';
  G=null;
}

/* ============================================================
   対戦画面
   ============================================================ */
function cardHTML(n,delay){
  const p=P[n-1],a=p.sh.split(' ');
  return `<div class="slot"><div class="card deal" style="animation-delay:${delay||0}ms;${catStyle(n)}" data-n="${n}" role="button" aria-label="${esc(p.skana)}"><div class="t"><span class="l1">${a[0]}</span><span class="l2">${a[1]}</span></div></div></div>`;
}
function renderCards(list){
  $('#field').innerHTML=list.map((n,i)=>cardHTML(n,i*30)).join('');
  G.fieldCount=list.length;
  layoutField();
}
function buildPlay(){
  app.innerHTML=`<div class="play">
    <div class="topbar"><div class="round" id="rd"></div><button class="menubtn" data-act="menu">⏸ メニュー</button></div>
    <div class="scores" id="scores"></div>
    <div class="reader" id="reader"></div>
    <div class="field" id="field"></div>
    ${G.humans>1?'<div class="buzzers" id="buz"></div>':''}
    ${G.practice?'<div class="pbar" id="pbar"></div>':''}
  </div>`;
  if(!G.practice)renderCards(G.deck);
  renderScores();renderBuzz();renderPbar();
}
function layoutField(){
  const f=$('#field');if(!f||!G)return;
  const w=f.clientWidth,h=f.clientHeight,n=G.fieldCount||G.deck.length,gap=5;
  if(!w||!h||!n)return;
  const sz=SIZES.find(x=>x[0]===LOOK.size)||SIZES[0],minH=sz[3];
  let best=2,bs=0;
  for(let c=2;c<=Math.min(12,Math.max(2,n));c++){
    const r=Math.ceil(n/c),cw=(w-(c-1)*gap)/c,ch=(h-(r-1)*gap)/r,s=Math.min(cw,ch/1.4);
    if(s>bs){bs=s;best=c;}
  }
  if(bs*1.4<minH){ /* 文字の大きさを守るため、足りないぶんはスクロール */
    const cw=Math.round(minH/1.4),c=Math.max(2,Math.min(n,Math.floor((w+gap)/(cw+gap)))),r=Math.ceil(n/c);
    f.classList.add('scrollmode');G.scrollMode=true;
    f.style.gridTemplateColumns=`repeat(${c},1fr)`;f.style.gridTemplateRows=`repeat(${r},${minH}px)`;
  }else{
    const r=Math.ceil(n/best);
    f.classList.remove('scrollmode');G.scrollMode=false;
    f.style.gridTemplateColumns=`repeat(${best},1fr)`;f.style.gridTemplateRows=`repeat(${r},1fr)`;
  }
}
const cardEl=n=>document.querySelector(`#field .card[data-n="${n}"]`);

function renderScores(){
  const el=$('#scores');if(!el||!G)return;
  if(G.practice){
    const pr=G.pr;
    el.innerHTML=`<div class="pchip" style="--c:var(--p3)"><span class="nm">正解</span><span class="sc">${pr.correct}</span></div>
      <div class="pchip" style="--c:var(--p1)"><span class="nm">ミス</span><span class="sc">${pr.miss}</span></div>
      <div class="pchip" style="--c:var(--p4)"><span class="nm">連続</span><span class="sc">${pr.streak}</span></div>`;
    return;
  }
  el.innerHTML=G.players.map(p=>`<div class="pchip ${G.floor===p.id?'floor':''} ${p.locked?'locked':''}" style="--c:${p.color}"><span class="nm">${esc(p.name)}${G.online&&G.online.myPid===p.id?' ★':''}${p.locked?' ✕':''}</span><span class="sc">${p.score}</span></div>`).join('');
}
function renderBuzz(){
  const b=$('#buz');if(!b||!G)return;
  b.innerHTML=G.players.filter(p=>p.kind==='human').map(p=>{
    const dis=G.phase!=='reading'||p.locked||G.floor!=null;
    return `<button class="bz" data-pid="${p.id}" style="--c:${p.color}" ${dis?'disabled':''}><span>${esc(p.name)}</span><kbd>キー ${p.slot+1}</kbd></button>`;
  }).join('');
}
function renderPbar(){
  const b=$('#pbar');if(!b||!G)return;
  const rd=G.phase==='reading';
  b.innerHTML=`<button class="pb" data-act="hint" ${rd?'':'disabled'}>ヒント</button><button class="pb" data-act="reveal" ${rd?'':'disabled'}>こたえを見る</button><button class="pb next" data-act="next" ${rd?'disabled':''}>つぎへ ▶</button>`;
}
function setRound(){const r=$('#rd');if(r)r.textContent=G.practice?`第${G.round+1}問 / ${G.deck.length}問`:`第${G.round+1}首 / ${G.deck.length}首`;}

/* ---------- ラウンド進行 ---------- */
function pickField(ans,count){
  const first=norm(P[ans-1].skana).charAt(0);
  const sim=shuffle(ALL.filter(n=>n!==ans&&norm(P[n-1].skana).charAt(0)===first));
  const rest=shuffle(ALL.filter(n=>n!==ans&&!sim.slice(0,2).includes(n)));
  const pick=sim.slice(0,Math.min(2,count-1));
  for(const n of rest){if(pick.length>=count-1)break;if(!pick.includes(n))pick.push(n);}
  return shuffle([ans,...pick]);
}
function nextRound(){
  $$('#field .card.reveal').forEach(c=>{c.classList.remove('reveal');c.classList.add('fade');});
  G.round++;
  if(G.round>=G.deck.length){finish();return;}
  const cur=P[G.deck[G.round]-1];
  G.cur=cur;G.phase='reading';G.t=0;G.shown=0;G.readDone=false;G.spoke=false;G.floor=null;G.floorT=0;G.rt=0;G.tapAt=null;
  G.q={miss:0,hint:false,revealed:false,shownAtHit:0};
  G.players.forEach(p=>{p.locked=!!p.gone;p.done=false;p.plan=null;if(p.kind==='ai')planAI(p);});
  if(G.online&&G.online.role==='host')G.online.wl=[];
  if(G.practice){const list=pickField(cur.n,G.fieldCount);G.field=new Set(list);renderCards(list);}
  else $$('#field .card').forEach(c=>c.classList.remove('dim','miss'));
  $('#field').classList.remove('armed');
  setRound();renderScores();renderBuzz();renderPbar();buildReading();
  pub();
}
function planAI(p){
  const L=aiParams(p.level),cur=G.cur,ci=G.ci,len=cur.kana.length;
  const kT=LEAD+(G.klen[cur.n]-1)*ci;
  const others=[...G.field].filter(n=>n!==cur.n);
  if(Math.random()<L.know){
    let pick=cur.n;
    if(others.length&&Math.random()<L.slip)pick=others[Math.floor(Math.random()*others.length)];
    p.plan={t:kT+L.delay*(.6+Math.random()*.8),pick};
  }else if(Math.random()<L.guess){
    const all=[...G.field];
    p.plan={t:LEAD+len*ci+1500+Math.random()*3500,pick:all[Math.floor(Math.random()*all.length)]};
  }
}
function buildReading(){
  const cur=G.cur,kl=G.klen[cur.n];let idx=0;
  const phrases=cur.kh.split(' ').map(ph=>'<span class="ph">'+[...ph].map(ch=>{
    const k=idx<kl?' kj':'';idx++;return `<span class="c${k}">${ch}</span>`;
  }).join('')+'</span>').join('');
  const showHint=G.practice||G.opts.hint;
  $('#reader').innerHTML=`<div class="rhead"><b>第${G.round+1}${G.practice?'問':'首'}</b><span id="rstate">耳をすませて…</span></div>
    <div class="kami ${showHint?'hintk':''} ${G.opts.showKami?'':'hidden'}" id="kami">${phrases}</div>
    ${G.opts.showKami?'':'<div class="listen">上の句は表示されません。読み上げに集中！</div>'}`;
}
function setState(t){const s=$('#rstate');if(s)s.textContent=t;}
function updateChars(){$$('#kami .c').forEach((s,i)=>s.classList.toggle('on',i<G.shown));}
function applyHint(){
  const cn=catOf(G.cur.n).label;
  setState(`ヒント：${cn}`);
  const ids=shuffle([...G.field].filter(n=>n!==G.cur.n));
  if(ids.length<3)return false;
  const keep=new Set([G.cur.n,ids[0],ids[1]]);
  $$('#field .card').forEach(c=>{const n=+c.dataset.n;if(G.field.has(n)&&!keep.has(n))c.classList.add('dim');});
  setState(`ヒント：${cn}。3枚にしぼったよ`);
  return true;
}

/* ---------- 時計 ---------- */
function readingTick(){
  const len=G.cur.kana.length;
  if(!G.spoke&&G.t>=LEAD){
    G.spoke=true;
    if(G.opts.tts)speak(G.cur.kk.replace(/ /g,'、'),RATE[G.opts.speed]);
    setState('詠み上げ中');
  }
  const shown=G.t<LEAD?0:Math.min(len,Math.floor((G.t-LEAD)/G.ci)+1);
  if(shown!==G.shown){G.shown=shown;updateChars();}
  if(!G.readDone&&shown>=len){
    G.readDone=true;G.readEndT=LEAD+len*G.ci;
    if(G.floor==null)setState('さあ、どの札？');
    if(G.opts.hint&&!G.practice)applyHint();
  }
}
function tick(){
  if(!G)return;
  const now=performance.now();let dt=now-G.last;G.last=now;if(dt>120)dt=120;
  if(G.paused||G.phase==='end'||G.phase==='idle')return;
  if(G.online&&G.online.role==='client'){   /* 参加者は表示だけ進める。判定はホスト */
    if(G.phase==='reading'){G.t+=dt;readingTick();}
    return;
  }
  if(G.phase==='reading'){
    G.t+=dt;
    readingTick();
    if(G.floor!=null){
      G.floorT+=dt;
      const bar=$('#floorbar');if(bar)bar.style.transform=`scaleX(${Math.max(0,1-G.floorT/FLOOR_MS)})`;
      if(G.floorT>=FLOOR_MS)passFloor();
    }else{
      for(const p of G.players){
        if(p.kind==='ai'&&!p.locked&&!p.done&&p.plan&&G.t>=p.plan.t){
          p.done=true;answer(p.id,p.plan.pick);
          if(G.phase!=='reading')return;
        }
      }
    }
    if(!G.practice&&G.phase==='reading'&&G.readDone&&G.floor==null&&G.t>=G.readEndT+TAIL_MS)endRound(null);
  }else if(G.phase==='result'){
    G.rt+=dt;
    if(G.rt>=(G.practice?RESULT_MS_PRACTICE:RESULT_MS))nextRound();
  }
}

/* ============================================================
   入力（ゲームの入口。ネット対戦はここへつなぐ）
   buzz(pid) … 早押しボタン　／　answer(pid, n) … 札nを選ぶ
   ============================================================ */
function buzz(pid){
  const p=G&&G.players[pid];
  if(!p||p.kind!=='human'||G.phase!=='reading'||p.locked||G.floor!=null)return;
  G.floor=pid;G.floorT=0;sfx('buz');
  const f=$('#field');f.style.setProperty('--c',p.color);f.classList.add('armed');
  setState(`${p.name}さん、札をえらんで！`);
  const r=$('#reader');
  if(!$('#floorbar')){const b=document.createElement('div');b.className='floorbar';b.id='floorbar';r.appendChild(b);}
  $('#floorbar').style.setProperty('--c',p.color);
  renderScores();renderBuzz();
}
function releaseFloor(){
  G.floor=null;G.floorT=0;
  const f=$('#field');if(f)f.classList.remove('armed');
  const b=$('#floorbar');if(b)b.remove();
  setState(G.readDone?'さあ、どの札？':'詠み上げ中');
}
function passFloor(){
  const p=G.players[G.floor];p.locked=true;
  toast(`${p.name} 時間切れ`);
  releaseFloor();renderScores();renderBuzz();
  if(G.players.every(q=>q.locked))endRound(null);
}
function answer(pid,n){
  const p=G&&G.players[pid];
  if(!p||G.phase!=='reading'||p.locked||!G.field.has(n))return;
  if(n===G.cur.n){
    p.score++;G.q.shownAtHit=G.shown;endRound(pid);
    return;
  }
  /* まちがい */
  const el=cardEl(n);
  if(G.practice){
    G.q.miss++;G.pr.miss++;G.pr.streak=0;sfx('ng');
    if(el){el.classList.add('wrong');}
    if(G.q.miss>=2)revealAnswer(false);
    toast('ちがうよ。もう一度');
    renderScores();return;
  }
  p.locked=true;
  if(G.opts.penalty&&p.score>0)p.score--;
  sfx('ng');
  if(el){el.classList.remove('miss');void el.offsetWidth;el.classList.add('miss');ring(el,'var(--shu)');}
  toast(`${p.name} お手つき！`);
  if(G.floor===pid)releaseFloor();
  renderScores();renderBuzz();
  if(G.online&&G.online.role==='host'){G.online.wl.push([pid,n]);pub();}
  if(G.players.every(q=>q.locked))endRound(null);
}
function onCard(n){
  if(!G||G.phase!=='reading'||!G.field.has(n))return;
  if(G.online&&G.online.role==='client'){const me=G.players[G.online.myPid];if(me&&!me.locked)sendAct(n);return;}
  let pid;
  if(G.humans===1)pid=G.players.find(p=>p.kind==='human').id;
  else{
    if(G.floor==null){toast('先に自分の色のボタンを押してください');return;}
    pid=G.floor;
  }
  answer(pid,n);
}
function practiceHint(){
  if(!G||!G.practice||G.phase!=='reading')return;
  G.q.hint=true;
  if(!applyHint())toast('札が少ないのでヒントは使えません');
}
function revealAnswer(user){
  if(!G||!G.practice||G.phase!=='reading')return;
  const el=cardEl(G.cur.n);
  if(el){el.classList.remove('wrong','dim');el.classList.add('reveal');}
  if(user){G.q.revealed=true;G.pr.streak=0;renderScores();}
  setState('光っている札がこたえ。タップしてみよう');
}

/* ---------- ラウンド終了 ---------- */
function endRound(pid){
  G.phase='result';G.rt=0;
  const fl=$('#floorbar');if(fl)fl.remove();
  $('#field').classList.remove('armed');
  G.floor=null;stopSpeech();
  const cur=G.cur,el=cardEl(cur.n);
  G.log.push({n:cur.n,taker:pid});
  G.field.delete(cur.n);
  $$('#field .card.dim,#field .card.wrong').forEach(c=>c.classList.remove('dim','wrong'));
  if(el){
    if(pid!=null){sfx('hit');if(G.players[pid].kind==='human')buzzHaptic(18);flyCard(el,pid);}
    else el.classList.add('reveal');
  }
  const kl=G.klen[cur.n],who=pid!=null?G.players[pid]:null;
  let rightTxt,meta;
  if(G.practice){
    const q=G.q,clean=q.miss===0&&!q.revealed&&pid!=null;
    G.pr.correct++;
    if(clean){G.pr.first++;G.pr.streak++;}
    else if(!G.pr.missed.includes(cur.n))G.pr.missed.push(cur.n);
    recProg(cur.n,clean);
    const early=clean&&!q.hint&&q.shownAtHit<=kl;
    if(early)G.pr.early++;
    const tm=!clean?'':early?`<em>${q.shownAtHit}文字で取れた！</em> 決まり字は${kl}文字`:`決まり字は${kl}文字（${q.shownAtHit}文字まで聞いて取った）`;
    rightTxt=clean?'● 正解！':`● 正解（ミス${q.miss}${q.revealed?'・こたえを見た':''}）`;
    meta=`<em>${catOf(cur.n).label}</em>・決まり字「<em>${esc(cur.kana.slice(0,kl))}</em>」${tm?'　'+tm:''}${mastered(cur.n)?'　<em>おぼえた札！</em>':''}`;
    renderScores();renderPbar();
  }else{
    rightTxt=who?'● '+esc(who.name)+' が取った':'だれも取れず';
    meta=`<em>${catOf(cur.n).label}</em>・決まり字「<em>${esc(cur.kana.slice(0,kl))}</em>」${G.online?'':'・タップで次へ'}`;
    renderScores();renderBuzz();
  }
  $('#reader').innerHTML=resultHTML(cur,who,rightTxt,meta);
  pub();
}
function resultHTML(cur,who,rightTxt,meta){
  return `<div class="res">
    <div class="rhead"><b>第${G.round+1}${G.practice?'問':'首'}　${esc(cur.au)}</b><span style="color:${who?who.color:'var(--mute)'}">${rightTxt}</span></div>
    <div class="k">${esc(cur.kk)}</div><div class="s">${esc(cur.sk)}</div>
    <div class="meta">${meta}</div></div>`;
}

/* ============================================================
   札を取る演出（弾かれて回転しながら飛ぶ・衝撃波・波紋）
   ============================================================ */
function ring(el,color){
  if(reduceMotion())return;
  const r=el.getBoundingClientRect();
  const d=document.createElement('div');d.className='fxring';d.style.setProperty('--c',color);
  d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';
  fx.appendChild(d);
  d.animate([{transform:'scale(.6)',opacity:.9},{transform:'scale(3.4)',opacity:0}],{duration:420,easing:'ease-out'}).onfinish=()=>d.remove();
}
function flyCard(el,pid){
  const r=el.getBoundingClientRect();
  el.classList.add('gone');
  if(reduceMotion())return;
  const color=G.players[pid].color;
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  /* 手が当たった位置。タップ位置が分かればそこ、AIなら上から */
  let ix,iy;
  const tap=G.tapAt;
  if(tap&&performance.now()-tap.t<2000){ix=tap.x;iy=tap.y;}
  else{ix=cx+(Math.random()-.5)*r.width*.6;iy=r.top+r.height*.1;}
  let ux=cx-ix,uy=cy-iy,m=Math.hypot(ux,uy);
  if(m<10){const a=Math.random()*6.283;ux=Math.cos(a);uy=Math.sin(a);}
  else{ux/=m;uy/=m;}
  const ang=Math.atan2(uy,ux)+(Math.random()-.5)*.8;
  ux=Math.cos(ang);uy=Math.sin(ang);
  const D=Math.min(innerWidth,innerHeight)*(.30+Math.random()*.2);
  const torque=((ix-cx)*uy-(iy-cy)*ux),sgn=torque===0?(Math.random()<.5?-1:1):Math.sign(torque);
  const rot=sgn*(160+Math.random()*320);
  /* 札のコピーを画面全体の上に出して飛ばす（場の外にも出られる） */
  const c=el.cloneNode(true);
  c.classList.remove('dim','miss','deal','gone','reveal','wrong');
  c.style.left=r.left+'px';c.style.top=r.top+'px';c.style.width=r.width+'px';c.style.height=r.height+'px';c.style.transformOrigin='50% 50%';
  fx.appendChild(c);
  /* 打った瞬間 → はじかれて加速 → 摩擦で減速して止まり、消える */
  const sh0='0 3px 0 rgba(0,0,0,.4)',sh1='0 16px 26px rgba(0,0,0,.5)';
  const T=(k,s,rr)=>`translate(${ux*D*k}px,${uy*D*k}px) rotate(${rr}deg) scale(${s})`;
  c.animate([
    {transform:'translate(0,0) rotate(0deg) scale(1)',boxShadow:sh0,offset:0},
    {transform:`translate(${-ux*3}px,${-uy*3}px) rotate(${-sgn*2}deg) scale(.96)`,boxShadow:sh0,offset:.09,easing:'cubic-bezier(.1,.8,.2,1)'},
    {transform:T(.62,1.06,rot*.62),boxShadow:sh1,offset:.42,easing:'cubic-bezier(.3,.6,.4,1)'},
    {transform:T(1,1,rot),boxShadow:sh0,offset:.8,opacity:1},
    {transform:T(1.04,.98,rot*1.03),opacity:0,offset:1}
  ],{duration:820,fill:'forwards'}).onfinish=()=>c.remove();
  ring({getBoundingClientRect:()=>({left:ix-1,top:iy-1,width:2,height:2})},color);
  /* 周りの札がびくっと揺れる */
  $$('#field .card').forEach(o=>{
    if(o===el||o.classList.contains('gone'))return;
    const b=o.getBoundingClientRect(),ox=b.left+b.width/2-cx,oy=b.top+b.height/2-cy,dist=Math.hypot(ox,oy)||1;
    const k=Math.max(0,1-dist/(r.height*2.6));if(k<=0)return;
    const ax=ox/dist*9*k,ay=oy/dist*9*k;
    o.animate([{transform:'translate(0,0)'},{transform:`translate(${ax}px,${ay}px) rotate(${ax*.2}deg)`,offset:.22},{transform:`translate(${-ax*.3}px,${-ay*.3}px)`,offset:.55},{transform:'translate(0,0)'}],{duration:360,easing:'ease-out'});
  });
  /* +1 が点数へ飛ぶ */
  const chips=$$('#scores .pchip'),chip=chips[G.practice?0:pid];
  if(chip){
    const cr=chip.getBoundingClientRect(),tx=cr.left+cr.width/2,ty=cr.top+cr.height/2;
    const pl=document.createElement('div');pl.className='fxplus';pl.textContent='+1';pl.style.setProperty('--c',color);
    pl.style.left=cx+'px';pl.style.top=cy+'px';fx.appendChild(pl);
    pl.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:'translate(-50%,-90%) scale(1.25)',opacity:1,offset:.25},
      {transform:`translate(calc(-50% + ${tx-cx}px),calc(-50% + ${ty-cy}px)) scale(.8)`,opacity:.9,offset:.85},
      {transform:`translate(calc(-50% + ${tx-cx}px),calc(-50% + ${ty-cy}px)) scale(.5)`,opacity:0}],{duration:760,easing:'ease-in-out'}).onfinish=()=>{
        pl.remove();chip.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
      };
  }
}

function renderBattleResult(){
  const sorted=[...G.players].sort((a,b)=>b.score-a.score);

  const head=winners.length>1?'引き分け':`${esc(winners[0].name)}の勝ち`;

  const rows=sorted.map((p,i)=>{
    if(p.score!==prev){rank=i+1;prev=p.score;}
    return `<div class="rrow ${p.score===top?'win':''}" style="--c:${p.color}"><span class="no">${rank}</span><span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></div>`;
  }).join('');

    const p=P[l.n-1],who=l.taker!=null?G.players[l.taker]:null;

  }).join('');

}

/* ============================================================
   オンライン対戦（room機能）。ホストが判定し、状態をpresenceで全員に配る
   ・ホスト … 部屋をつくった人。ゲーム本体（今までの対戦ロジック）を動かす
   ・参加者 … ホストから届いた状態を表示し、札をタップしたらホストへ知らせる
   ============================================================ */
let OL=null;
function roomCap(){
  try{return (window.claude&&window.claude.use)?Promise.resolve(window.claude.use('room')).catch(()=>null):Promise.resolve(null);}
  catch(e){return Promise.resolve(null);}
}
const OL_CHARS='abcdefghjkmnpqrstuvwxyz23456789';
const olNameVal=()=>((STORE.olName||'').trim().slice(0,8))||'ゲスト';
function renderOnlineHome(){
  app.innerHTML=`<div class="screen"><div class="bar"><button class="back" data-act="home">‹ もどる</button><h2>オンライン対戦</h2></div>

  roomCap().then(r=>{const e=$('#olstat');if(e)e.textContent=r?'オンライン対戦が使えます。':'この画面ではオンライン対戦が使えません。招待された人が、サインインして開いてください。';});
}
function olCreate(){let c='';for(let i=0;i<4;i++)c+=OL_CHARS[Math.floor(Math.random()*OL_CHARS.length)];olConnect(c,true);}
function olJoin(){
  const el=$('#olcode'),c=(el?el.value:'').trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(c)){toast('4文字の部屋番号を入れてください');return;}
  olConnect(c,false);
}
async function olConnect(code,host){
  const cap=await roomCap();
  if(!cap){toast('オンライン対戦が使えません');return;}
  let room;
  try{room=await cap.join('hk-'+code);}catch(e){toast('部屋に入れませんでした');return;}
  if(OL)olCleanup();
  OL={room,code,host,order:[],unsubs:[],lastG:null,lastLobby:null,actSeq:0,ai:0,screen:'lobby',hostSeen:false};
  setup.opts={...DEF,...(STORE.opts||{})};setup.cats=(STORE.cats||[]).slice();
  OL.unsubs.push(room.onPeers(olPeers));
  const pres={me:{n:olNameVal()}};if(host)pres.host=1;
  try{await room.presence(pres);}catch(e){}
  renderLobby();
}
function olCleanup(){
  if(!OL)return;
  const o=OL;OL=null;
  o.unsubs.forEach(f=>{try{f();}catch(e){}});
  try{o.room.leave();}catch(e){}
}
function olLeave(){olCleanup();stopGame();showHome();}
function olBackToLobby(){
  if(!OL)return showHome();
  stopGame();
  if(OL.host){try{OL.room.presence({g:null});}catch(e){}}
  keepScroll(renderLobby);
}
function lobbyPeers(){
  const ps=OL.room.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.me);
  const hp=ps.find(p=>p.presence.host===1);
  const rest=OL.order.map(id=>ps.find(p=>p.peer===id)).filter(p=>p&&p!==hp);
  return hp?[hp,...rest]:rest;
}
function olPeers(ch){
  if(!OL)return;
  const peers=ch.peers.filter(p=>p.kind==='viewer');
  peers.forEach(p=>{if(p.presence&&p.presence.me&&!OL.order.includes(p.peer))OL.order.push(p.peer);});
  if(G&&G.online&&G.online.role==='host'){
    ch.left.forEach(p=>{const q=G.players.find(x=>x.peer===p.peer);if(q)q.gone=true;});
  }
  let need=ch.joined.length>0||ch.left.length>0;
  if(OL.host){olActs(peers);}
  else{
    const host=peers.find(p=>!p.isMe&&p.presence&&p.presence.host===1);
    if(host){
      OL.hostSeen=true;
      if(host.presence.lobby!==OL.lastLobby){OL.lastLobby=host.presence.lobby;need=true;}
      const g=host.presence.g;
      if(g&&g!==OL.lastG){OL.lastG=g;applyState(g);}
    }else if(OL.hostSeen){toast('ホストが退出しました');olLeave();return;}
  }
  if(OL&&OL.screen==='lobby'&&need)keepScroll(renderLobby);
}

    </section>
    <section class="sec"><h3>ルール</h3>${commonOptsHTML(true)}</section>
    <button class="btn" data-act="ol-start">はじめる（${total}人）</button>`
    :`<section class="sec"><h3>ホストの設定</h3><p class="note">${lobbyInfo?esc(summaryText(lobbyInfo)):(OL.hostSeen?'':'ホストを探しています…')}</p></section>
      <p class="note">ホストが始めると、自動で対戦画面になります。</p>`;
  app.innerHTML=`<div class="screen"><div class="bar"><button class="back" data-act="ol-leave">‹ ぬける</button><h2>ロビー</h2></div>

  newGame(players,setup.cats,{role:'host',room:OL.room,myPid:0,seq:0,gid:Math.random().toString(36).slice(2,8),seqBy,wl:[]});
}
/* ホスト: 参加者の「札をタップした」を受けとって判定する */
function olActs(peers){
  if(!G||!G.online||G.online.role!=='host'||G.phase!=='reading')return;
  for(const p of peers){
    if(p.isMe||!p.presence||!p.presence.a)continue;
    const a=p.presence.a,last=G.online.seqBy[p.peer]||0;
    if(!(a.s>last))continue;
    G.online.seqBy[p.peer]=a.s;
    const pid=G.players.findIndex(q=>q.peer===p.peer);
    if(pid>=0&&a.r===G.round&&G.phase==='reading')answer(pid,a.n);
  }
}
/* ホスト: いまの状態を全員に配る */
function pub(){
  if(!OL||!G||!G.online||G.online.role!=='host')return;
  const o=G.online;o.seq++;
  const last=G.log[G.log.length-1];
  const st={gid:o.gid,seq:o.seq,r:G.round,ph:G.phase==='reading'?'r':G.phase==='result'?'x':'e',cur:G.cur?G.cur.n:0,
    fld:[...G.field],sc:G.players.map(p=>p.score),lk:G.players.map(p=>p.locked?1:0),
    tk:(G.phase==='result'&&last&&G.cur&&last.n===G.cur.n&&last.taker!=null)?last.taker:-1,
    dk:G.deck,pl:G.players.map(p=>[p.name,p.kind==='ai'?1:p.kind==='remote'?2:0,p.slot,p.level||0,p.peer||'']),
    o:{sk:+G.opts.showKami,h:+G.opts.hint,t:+G.opts.tts,x:+G.opts.sfx,sp:G.opts.speed,pn:+G.opts.penalty},
    wl:o.wl,lg:G.phase==='end'?G.log.map(l=>[l.n,l.taker==null?-1:l.taker]):0};
  try{OL.room.presence({g:st});}catch(e){}
}
/* 参加者: 札をタップしたことをホストへ */
function sendAct(n){
  OL.actSeq++;
  try{OL.room.presence({a:{s:OL.actSeq,r:G.round,n}});}catch(e){}
}
function clientStart(st){
  stopGame();
  const me=OL.room.peers().find(p=>p.isMe&&p.sameTab),myPeer=me?me.peer:'';
  const players=st.pl.map((x,i)=>({id:i,slot:x[2],kind:x[4]&&x[4]===myPeer?'human':(x[1]===1?'ai':'remote'),level:x[3],peer:x[4],name:x[0],color:`var(--p${x[2]+1})`,score:0,locked:false}));
  const myPid=players.findIndex(p=>p.kind==='human');
  const opts={...DEF,showKami:!!st.o.sk,hint:!!st.o.h,tts:!!st.o.t,sfx:!!st.o.x,speed:st.o.sp,penalty:!!st.o.pn};
  const deck=st.dk.slice();
  G=baseG({practice:false,players,opts,ci:SPEED[opts.speed]||250,deck,field:new Set(st.fld),fieldCount:deck.length,klen:kimariji(deck),humans:1,
    online:{role:'client',myPid,gid:st.gid,lastSeq:-1,res:-1,wlRound:-1,wlCount:0}});
  warmUp(opts);buildPlay();
  $$('#field .card').forEach(c=>{if(!G.field.has(+c.dataset.n))c.classList.add('gone');});
  G.timer=setInterval(tick,40);
  OL.screen='game';
  applyState(st);
}
function newRoundClient(st){
  $$('#field .card.reveal').forEach(c=>{c.classList.remove('reveal');c.classList.add('fade');});
  const cur=P[st.cur-1];
  G.round=st.r;G.cur=cur;G.phase='reading';G.t=0;G.shown=0;G.readDone=false;G.spoke=false;G.rt=0;
  G.q={miss:0,hint:false,revealed:false,shownAtHit:0};
  G.field=new Set(st.fld);
  G.online.wlRound=st.r;G.online.wlCount=0;
  $$('#field .card').forEach(c=>c.classList.remove('dim','miss','wrong'));
  setRound();buildReading();
}
function applyState(st){
  if(!OL)return;
  if(!G||!G.online||G.online.role!=='client'||G.online.gid!==st.gid){
    if(st.ph==='e')return;
    clientStart(st);return;
  }
  const o=G.online;
  if(st.seq<=o.lastSeq)return;
  o.lastSeq=st.seq;
  G.players.forEach((p,i)=>{p.score=st.sc[i]||0;p.locked=!!st.lk[i];});
  if(st.ph!=='e'&&st.r!==G.round)newRoundClient(st);
  /* お手つき（まだ見せていない分だけ） */
  const wl=st.wl||[];
  if(o.wlRound!==st.r){o.wlRound=st.r;o.wlCount=0;}
  for(let i=o.wlCount;i<wl.length;i++){
    const w=wl[i],pl=G.players[w[0]],el=cardEl(w[1]);
    if(el){el.classList.remove('miss');void el.offsetWidth;el.classList.add('miss');ring(el,'var(--shu)');}
    sfx('ng');if(pl)toast(`${pl.name} お手つき！`);
  }
  o.wlCount=wl.length;
  if(st.ph==='r'){G.field=new Set(st.fld);renderScores();}
  else if(st.ph==='x'){
    if(o.res!==st.r){o.res=st.r;endRoundClient(st);}
    renderScores();
  }else if(st.ph==='e'){finishClient(st);}
}
function endRoundClient(st){
  G.phase='result';stopSpeech();
  const cur=P[st.cur-1];G.cur=cur;
  const pid=st.tk>=0?st.tk:null,who=pid!=null?G.players[pid]:null,el=cardEl(cur.n);
  G.field.delete(cur.n);
  $$('#field .card.dim,#field .card.wrong').forEach(c=>c.classList.remove('dim','wrong'));
  if(el){
    if(pid!=null){sfx('hit');if(pid===G.online.myPid)buzzHaptic(18);flyCard(el,pid);}
    else el.classList.add('reveal');
  }
  const kl=G.klen[cur.n];
  $('#reader').innerHTML=resultHTML(cur,who,who?'● '+esc(who.name)+' が取った':'だれも取れず',`<em>${catOf(cur.n).label}</em>・決まり字「<em>${esc(cur.kana.slice(0,kl))}</em>」`);
}
function finishClient(st){
  if(G.phase==='end')return;
  G.players.forEach((p,i)=>{p.score=st.sc[i]||0;});
  G.log=(st.lg||[]).map(l=>({n:l[0],taker:l[1]>=0?l[1]:null}));
  G.phase='end';
  if(G.timer){clearInterval(G.timer);G.timer=null;}
  stopSpeech();
  renderBattleResult();
}

/* ============================================================
   イベント
   ============================================================ */
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  ac();
  const a=t.dataset.act;
  switch(a){
    case 'go-ai':initSetup('ai');renderSetup();break;
    case 'go-friend':initSetup('friend');renderSetup();break;
    case 'go-practice':setup.opts={...DEF,...(STORE.opts||{})};prac={...DEFP,...(STORE.prac||{})};prac.cats=(prac.cats||[]).slice();renderPractice();break;
    case 'go-list':showList();break;
    case 'go-online':renderOnlineHome();break;
    case 'ol-create':olCreate();break;
    case 'ol-join':olJoin();break;
    case 'ol-leave':olLeave();break;
    case 'ol-start':olStart();break;
    case 'ol-lobby':olBackToLobby();break;
    case 'ol-ai':OL.ai=t.dataset.v==='1'?(OL.ai||STORE.aiLv||5):0;keepScroll(renderLobby);break;
    case 'ol-lv':OL.ai=Math.max(1,Math.min(10,OL.ai+(+t.dataset.d)));updateOlLv();break;
    case 'ol-copy':try{navigator.clipboard.writeText(OL.code).then(()=>toast('コピーしました'),()=>toast('番号: '+OL.code));}catch(e){toast('番号: '+OL.code);}break;
    case 'cat':{
      const arr=t.dataset.scope==='prac'?prac.cats:setup.cats,i=arr.indexOf(t.dataset.id);
      if(i>=0)arr.splice(i,1);else arr.push(t.dataset.id);
      if(t.dataset.scope==='prac')keepScroll(renderPractice);else rerenderSettings();break;
    }
    case 'lcat':listCat=t.dataset.id||null;renderListCats();renderList($('#q').value);break;
    case 'go-look':renderLook();break;
    case 'home':showHome();break;
    case 'slot':{
      const i=+t.dataset.i,k=t.dataset.k;
      setup.slots[i]=k==='human'?{kind:'human'}:k==='none'?{kind:'none'}:{kind:'ai',level:(setup.slots[i].level||STORE.aiLv||5)};
      keepScroll(renderSetup);break;
    }
    case 'lv':{
      const i=+t.dataset.i,s=setup.slots[i];
      s.level=Math.max(1,Math.min(10,s.level+(+t.dataset.d)));updateLv(i);break;
    }
    case 'opt':{const v=t.dataset.v;setup.opts[t.dataset.key]=/^\d+$/.test(v)?+v:v;rerenderSettings();break;}
    case 'tog':setup.opts[t.dataset.key]=!setup.opts[t.dataset.key];rerenderSettings();break;
    case 'prac':{const v=t.dataset.v;prac[t.dataset.key]=/^\d+$/.test(v)?+v:v;keepScroll(renderPractice);break;}
    case 'prac-start':{
      const pool=practicePool(prac.range,prac.cats);
      if(!pool.length){toast(prac.range==='weak'?'苦手な札はまだありません':'この範囲に札がありません');break;}
      STORE.opts=setup.opts;STORE.prac=prac;persist();
      startPractice(pool,prac.q,prac.fs);break;
    }
    case 'look':LOOK[t.dataset.key]=t.dataset.v;STORE.look=LOOK;persist();applyLook();keepScroll(renderLook);break;
    case 'look-reset':LOOK={...DEFLOOK};STORE.look=LOOK;persist();applyLook();keepScroll(renderLook);break;
    case 'start':startGame();break;
    case 'again':restartLast();break;
    case 'again-missed':{const pool=G&&G.pr?G.pr.missed.slice():[];if(pool.length)startPractice(pool,pool.length,lastRun.fs);break;}
    case 'resetup':lastRun&&lastRun.type==='practice'?renderPractice():renderSetup();break;
    case 'menu':openMenu();break;
    case 'resume':closeMenu();break;
    case 'restart':closeMenu();restartLast();break;
    case 'hint':practiceHint();break;
    case 'reveal':revealAnswer(true);break;
    case 'next':if(G&&G.phase==='result')nextRound();break;
  }
});
function rerenderSettings(){
  if(OL&&OL.screen==='lobby'){keepScroll(renderLobby);return;}
  if($('.pnum')||$$('[data-act="prac"]').length)keepScroll(renderPractice);else keepScroll(renderSetup);
}
/* 対戦中の入力は pointerdown（反応を速くするため）。スクロール表示のときだけ click */
app.addEventListener('pointerdown',e=>{
  if(!G)return;
  const bz=e.target.closest('.bz');
  if(bz){if(!bz.disabled)buzz(+bz.dataset.pid);return;}
  const rd=e.target.closest('#reader');
  if(rd&&G.phase==='result'&&!G.online&&G.rt>400){nextRound();return;}
  if(!G.scrollMode){const c=e.target.closest('#field .card');if(c){G.tapAt={x:e.clientX,y:e.clientY,t:performance.now()};onCard(+c.dataset.n);}}
});
app.addEventListener('click',e=>{
  if(!G||!G.scrollMode)return;
  const c=e.target.closest('#field .card');
  if(c){G.tapAt={x:e.clientX,y:e.clientY,t:performance.now()};onCard(+c.dataset.n);}
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.olname!==undefined){STORE.olName=t.value;persist();}
  else if(t.dataset&&t.dataset.olcode!==undefined){t.value=t.value.toLowerCase().replace(/[^a-z0-9]/g,'');}
  else if(t.dataset&&t.dataset.ollv!==undefined){if(OL){OL.ai=+t.value;updateOlLv();}}
  else if(t.dataset&&t.dataset.name!==undefined)setup.names[+t.dataset.name]=t.value;
  else if(t.dataset&&t.dataset.lv!==undefined){setup.slots[+t.dataset.lv].level=+t.value;updateLv(+t.dataset.lv);}
  else if(t.id==='q')renderList(t.value);
});
document.addEventListener('keydown',e=>{
  if(!G||G.phase==='end')return;
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.key>='1'&&e.key<='4'&&G.humans>1){
    const p=G.players.find(p=>p.kind==='human'&&p.slot===(+e.key-1));
    if(p)buzz(p.id);
  }
  if(e.key===' '&&G.phase==='result'&&!G.online&&G.rt>400){e.preventDefault();nextRound();}
  if(e.key==='Escape')($('.modal')?closeMenu():openMenu());
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!(G&&G.online))openMenu();});
window.addEventListener('resize',()=>{if(G&&G.phase!=='end')layoutField();});

window.__hyakunin={CATS,catPool,practicePool,P,kimariji,KJ_ALL,aiParams,state:()=>G,setup:()=>setup,look:()=>LOOK,home:()=>showHome()};   /* home：風の芽経済組（kz.js）から */
applyLook();
showHome();
})();
</script>
