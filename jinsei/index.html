<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生すごろく｜風の芽製作所</title>
<meta name="description" content="風の芽の国で、うまれてから引退するまでをルーレットで進むすごろく。しごと・結婚・家・株・競馬。CPU・同じ端末で4人・ネット対戦。">
<meta name="theme-color" content="#14181B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 人生すごろく（風の芽製作所・2026-11-01）
   人生を1本の鉄道として描く：盤面は路線図（駅＝マス・線の色＝人生の時期）、ルーレットは駅の発車標（LED）、できごとは きっぷ。 */
:root{
  --paper:#EEF3F6; --ink:#1E2A33; --muted:#5D6D79; --rule:#C9D4DC; --sign:#FFFFFF; --card:#FFFFFF;
  --led:#14181B; --amber:#FFA53A; --ledg:#7EE2A8; --go:#169A58; --go-d:#0E7441; --plus:#11804A; --minus:#C2302E; --gold:#FFD54F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#141C22; --ink:#E6EDF1; --muted:#9AABB7; --rule:#2D3B45; --sign:#1B262E; --card:#1B262E; --plus:#5BD38F; --minus:#FF7A73; }
}
:root[data-theme="dark"]{ --paper:#141C22; --ink:#E6EDF1; --muted:#9AABB7; --rule:#2D3B45; --sign:#1B262E; --card:#1B262E; --plus:#5BD38F; --minus:#FF7A73; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;font-weight:500;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2E86DE;outline-offset:2px}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--rule);background:var(--sign);flex:none}
.back{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar-t{flex:1;text-align:center;font-weight:900;font-size:15px;letter-spacing:.06em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-r{display:flex;gap:6px}
.ib{border:1px solid var(--rule);background:var(--sign);border-radius:10px;min-width:38px;height:36px;font-size:15px;font-weight:700;padding:0 8px}
.scr{flex:1;min-height:0;overflow:auto}

/* ---- ホーム：駅名標 ---- */
.home{max-width:640px;margin:0 auto;padding:22px 16px 48px}
.sign{background:#fff;color:#1E2A33;border:2px solid #C3CED6;border-radius:6px;padding:16px 0 0;text-align:center;box-shadow:0 3px 0 rgba(30,42,51,.12)}
.sign-kana{font-size:14px;letter-spacing:.32em;color:#5D6D79;padding-left:.32em}
.sign-name{font-size:clamp(36px,11vw,58px);font-weight:900;margin:2px 0 0;letter-spacing:.1em;padding-left:.1em;line-height:1.15}
.sign-en{font-size:13px;color:#5D6D79;letter-spacing:.14em;margin:2px 0 14px}
.sign-bar{display:flex;height:14px}
.sign-bar i{flex:1}
.sign-ends{display:flex;justify-content:space-between;padding:7px 12px 9px;font-weight:700;font-size:13px}
.sign-ends small{display:block;font-weight:500;color:#5D6D79;font-size:11px}
.sign-ends span:last-child{text-align:right}
.lead{margin:16px 2px 0;line-height:1.8;font-size:15px}
.sec{margin-top:24px}
.sec h2{font-size:16px;margin:0 0 8px;font-weight:900}
.seat{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.seat input{flex:1;min-width:0;border:1px solid var(--rule);background:var(--sign);border-radius:8px;padding:8px 10px;font-size:15px}
.seat.off input{opacity:.45}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:999px;overflow:hidden;flex:none;background:var(--sign)}
.seg button{border:0;background:transparent;padding:7px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lens{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.len{border:1.5px solid var(--rule);background:var(--sign);border-radius:12px;padding:10px 6px;text-align:center;font-weight:900;font-size:16px}
.len small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.len[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.go{display:block;width:100%;border:0;border-radius:14px;background:var(--go);color:#fff;font-weight:900;font-size:20px;letter-spacing:.08em;padding:15px;box-shadow:0 4px 0 var(--go-d);margin-top:22px}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--go-d)}
.go:disabled{background:#8E9AA3;box-shadow:0 4px 0 #6F7A82}
.sub{display:block;width:100%;border:1.5px solid var(--ink);background:transparent;border-radius:14px;font-weight:900;font-size:16px;padding:12px;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.net{margin-top:14px;padding:14px;border:1.5px dashed var(--rule);border-radius:14px}
.net p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--muted)}
.code-in{display:flex;gap:8px;margin-top:10px}
.code-in input{flex:1;min-width:0;border:1.5px solid var(--rule);background:var(--sign);border-radius:10px;padding:10px;font-family:'DotGothic16',monospace;font-size:22px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.code-in button{flex:none;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:900;padding:0 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.rules{margin-top:26px;font-size:14px;line-height:1.75}
.rules summary{font-weight:900;font-size:16px;cursor:pointer}
.rules li{margin:4px 0}

/* ---- 部屋（ネット対戦） ---- */
.lob{max-width:560px;margin:0 auto;padding:22px 16px 48px}
.ledbox{background:var(--led);border-radius:12px;padding:14px 16px;color:var(--amber);font-family:'DotGothic16',monospace}
.ledbox .big{font-size:44px;letter-spacing:.35em;text-shadow:0 0 10px rgba(255,165,58,.55)}
.ledbox .lt{font-size:14px;color:var(--ledg)}
.mem{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--rule);font-weight:700}
.mem small{font-weight:500;color:var(--muted);margin-left:auto}
.cpuc{display:flex;align-items:center;gap:10px;margin-top:12px}
.cpuc button{border:1.5px solid var(--rule);background:var(--sign);border-radius:10px;width:44px;height:40px;font-weight:900;font-size:18px}

/* ---- ゲーム ---- */
#game{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"pls" "board" "dock";position:relative;overflow:hidden}
.pls{grid-area:pls;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px;background:var(--sign);border-bottom:1px solid var(--rule)}
.pc{display:flex;align-items:center;gap:8px;min-width:0;border:1.5px solid var(--rule);border-radius:10px;padding:4px 8px;background:var(--paper);text-align:left;position:relative}
.pc.on{border-color:var(--pc);box-shadow:inset 0 0 0 1.5px var(--pc)}
.pc.out{opacity:.7}
.pc .tx{min-width:0;flex:1;line-height:1.3}
.pc .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pc .mo{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc .ics{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bw{grid-area:board;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.board{position:relative;margin:0 auto;max-width:620px}
.board svg{position:absolute;left:0;top:0;pointer-events:none}
.st{position:absolute;width:0;height:0}
.st .mk{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--lc)}
.st.stop .mk{left:-15px;top:-12px;width:30px;height:24px;border-radius:7px;border-width:4px}
.st.k-pay .mk{background:var(--gold)}
.st.k-goal .mk,.st.k-start .mk{left:-16px;top:-16px;width:32px;height:32px;border-width:6px}
.st .lb{position:absolute;left:22px;top:0;transform:translateY(-50%);font-size:13px;line-height:1.3}
.st.stop .lb{left:26px}
.st.k-goal .lb,.st.k-start .lb{left:28px}
.st.right .lb{left:auto;right:22px;text-align:right}
.st .no{display:inline-block;background:var(--lc);color:var(--lf,#fff);border-radius:4px;font-size:10.5px;font-weight:900;padding:0 4px;margin-right:4px;vertical-align:1px;font-variant-numeric:tabular-nums}
.st b{font-weight:700}
.st.stop b{font-weight:900}
.st small{display:block;color:var(--muted);font-size:11.5px}
.st .tg{font-style:normal;font-size:10.5px;border:1px solid var(--rule);border-radius:4px;padding:0 3px;margin-left:3px;color:var(--muted);white-space:nowrap}
.st .tg.me{border-color:#D99A00;color:#A26F00;background:#FFF4D1}
.lane-t{position:absolute;font-size:12px;font-weight:900;color:#fff;border-radius:999px;padding:2px 9px;transform:translate(-50%,-50%);white-space:nowrap}
.tok{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--pc);border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;transition:transform .16s ease;z-index:3;pointer-events:none}
.tok.on{z-index:4}
.tok.on::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--pc);animation:ring 1.3s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.75)}to{opacity:0;transform:scale(1.45)}}

.dock{grid-area:dock;background:var(--led);color:var(--amber);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;position:relative;z-index:6}
.led-num{font-family:'DotGothic16',monospace;font-size:46px;line-height:1;width:66px;height:60px;display:grid;place-items:center;background:#000;border-radius:8px;border:1px solid #2A3238;color:var(--amber);text-shadow:0 0 9px rgba(255,165,58,.6)}
.led-num.idle{color:#5A4325;text-shadow:none}
.led-txt{font-family:'DotGothic16',monospace;font-size:15px;line-height:1.4;min-width:0}
.led-txt .l1{color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led-txt .l2{color:var(--ledg);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fire{border:0;border-radius:14px;background:var(--go);color:#fff;font-weight:900;font-size:21px;letter-spacing:.1em;min-width:96px;min-height:60px;box-shadow:0 4px 0 var(--go-d);padding:0 14px;line-height:1.1}
.fire small{display:block;font-size:10.5px;letter-spacing:0;font-weight:700;opacity:.85}
.fire:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--go-d)}
.fire:disabled{background:#2C353B;color:#7E8B94;box-shadow:0 4px 0 #1C2327}
.dock-sub{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:-2px}
.dock-sub button{border:1px solid #2F3A41;background:transparent;color:#AFC0CB;border-radius:8px;font-size:12.5px;font-weight:700;padding:4px 10px}

/* きっぷ（できごと） */
.card{position:absolute;left:10px;right:10px;bottom:calc(var(--dockh,128px) + 10px);max-height:min(56%,480px);overflow:auto;z-index:5;background:var(--card);border-radius:12px;border:1px solid var(--rule);box-shadow:0 12px 34px rgba(20,24,27,.28)}
.card-h{display:flex;align-items:flex-start;gap:8px;padding:11px 12px 10px 20px;border-bottom:2px dashed var(--rule);position:relative}
.card-h::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--lc);border-radius:12px 0 0 0}
.card-h .who{flex:none}
.card-h .tt{flex:1;min-width:0}
.card-h .tt small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.card-h .tt b{font-size:17px;font-weight:900}
.card-h .x{flex:none;border:0;background:transparent;font-size:20px;line-height:1;padding:2px 4px;color:var(--muted)}
.card-b{padding:8px 12px 12px 20px}
.fx{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0;font-size:15px;line-height:1.45}
.fx .d{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.fx .d.p{color:var(--plus)}.fx .d.n{color:var(--minus)}
.fx.tok{color:#A26F00;font-weight:700}
.fx.debt,.fx.info{color:var(--muted);font-size:14px}
.fx.win{font-weight:900}
.ask{margin-top:6px;font-weight:900}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);background:var(--sign);border-radius:10px;padding:10px 12px;font-weight:700;width:100%}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{opacity:.55}
.opt .n{flex:none;width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:900}
.opt .ot{min-width:0}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;line-height:1.5}
.opt .lc{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.nums button{border:1.5px solid var(--rule);background:var(--sign);border-radius:10px;height:46px;font-family:'DotGothic16',monospace;font-size:22px}
.nums button:disabled{opacity:.5}
.wait{margin-top:8px;color:var(--muted);font-size:14px}

.pop{position:fixed;z-index:30;font-weight:900;font-size:15px;pointer-events:none;animation:pop 1.4s ease-out forwards;text-shadow:0 1px 0 var(--paper),0 -1px 0 var(--paper),1px 0 0 var(--paper),-1px 0 0 var(--paper)}
.pop.p{color:var(--plus)}.pop.n{color:var(--minus)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}15%{opacity:1}to{opacity:0;transform:translateY(-26px)}}

/* シート（くわしく・記録・あそびかた） */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--card);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px max(18px,env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet-h b{flex:1;font-size:17px;font-weight:900}
.sheet-h button{border:1px solid var(--rule);background:var(--sign);border-radius:10px;padding:6px 12px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px;line-height:1.5}
.kv b{color:var(--muted);font-weight:700}
.logl{font-size:14px;line-height:1.6}
.logl div{padding:3px 0;border-bottom:1px dashed var(--rule);display:flex;gap:8px;align-items:baseline}
.logl i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--pc,#999);display:inline-block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}

/* けっか */
.res{max-width:620px;margin:0 auto;padding:22px 16px 48px}
.rsign .sign-name{font-size:clamp(30px,9vw,48px)}
.rk{display:grid;grid-template-columns:34px 24px minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:12px 2px;border-bottom:1px solid var(--rule)}
.rk .o{font-family:'DotGothic16',monospace;font-size:30px;text-align:center}
.rk .nm{font-weight:900;font-size:17px;min-width:0}
.rk .nm .jb{display:block;font-size:12.5px;font-weight:500}
.rk .tot{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk .bk{grid-column:3/-1;font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:4px;display:flex;flex-wrap:wrap;column-gap:8px}
.rk .bk span{white-space:nowrap}

@media (min-width:880px){
  #game{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"board pls" "board dock" "board side"}
  .pls{grid-template-columns:1fr;border-left:1px solid var(--rule);border-bottom:0}
  .bw{border-right:1px solid var(--rule)}
  .dock{margin:0 10px;border-radius:14px}
  .card{position:static;grid-area:side;margin:10px;max-height:none;align-self:start;box-shadow:0 4px 14px rgba(20,24,27,.12)}
}
@media (prefers-reduced-motion: reduce){
  .tok{transition:none}
  .tok.on::after{animation:none;opacity:.55;transform:scale(1.15)}
  .pop{animation-duration:.01s}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <a class="back" href="../">‹ 風の芽経済組</a>
    <div class="bar-t" id="barT">人生すごろく</div>
    <div class="bar-r"><button class="ib" id="bRule" type="button" aria-label="あそびかた">？</button><button class="ib" id="bSnd" type="button" aria-label="音"></button></div>
  </header>

  <main id="home" class="scr">
    <div class="home">
      <div class="sign" role="img" aria-label="駅名標：人生すごろく。前の駅 うまれる、つぎの駅 いんたい">
        <div class="sign-kana">じんせいすごろく</div>
        <h1 class="sign-name">人生すごろく</h1>
        <div class="sign-en">Jinsei Sugoroku</div>
        <div class="sign-bar" id="signBar"></div>
        <div class="sign-ends"><span>◀ うまれる<small>Umareru</small></span><span>いんたい ▶<small>Intai</small></span></div>
      </div>
      <p class="lead">風の芽の国で、うまれてから引退するまでを、ルーレットで1駅ずつ進みます。しごと・結婚・家・株・競馬。いちばんお金持ちで引退した人の勝ちです（ゲームの中のお金です。所持金の X は使いません）。</p>
      <div id="cont" hidden></div>
      <section class="sec">
        <h2>あそぶ人</h2>
        <div id="seats"></div>
      </section>
      <section class="sec">
        <h2>長さ</h2>
        <div class="lens" id="lens"></div>
      </section>
      <button class="go" id="bStart" type="button">出発する</button>
      <section class="net">
        <h2 style="margin:0 0 6px;font-size:16px;font-weight:900">ネットで遊ぶ</h2>
        <p>部屋をつくると、4文字の部屋番号が出ます。友だちは「部屋に入る」に番号を入れます（4人まで。足りない分は CPU）。</p>
        <button class="sub" id="bHost" type="button" style="margin-top:0">部屋をつくる</button>
        <div class="code-in"><input id="codeIn" maxlength="4" placeholder="ABCD" autocomplete="off" inputmode="latin" aria-label="部屋番号"><button id="bJoin" type="button">部屋に入る</button></div>
      </section>
      <details class="rules" id="rulesBox"><summary>あそびかた</summary><div id="rulesTxt"></div></details>
    </div>
  </main>

  <main id="lobby" class="scr" hidden>
    <div class="lob" id="lobIn"></div>
  </main>

  <main id="game" class="scr" hidden>
    <div class="pls" id="pls"></div>
    <div class="bw" id="bw"><div class="board" id="board"><svg id="lines" aria-hidden="true"></svg><div id="sts"></div><div id="toks"></div></div></div>
    <section class="card" id="card" hidden aria-live="polite"></section>
    <div class="dock" id="dock">
      <div class="led-num idle" id="ledNum" aria-hidden="true">-</div>
      <div class="led-txt"><div class="l1" id="led1"></div><div class="l2" id="led2"></div></div>

async function pump() {

    if (!prev || prev.pl.length !== g.pl.length || prev.len !== g.len) { V.pos = g.pl.map(p => p.pos); V.m = g.pl.map(p => p.m); layoutBoard(true); }

    if (ev && ev.s !== V.es) {
      V.busy = true; updDock();
      const jump = ev.s > V.es + 1 && V.es !== 0 && !ev.path.length;
      V.es = ev.s;
      if (!jump) await play(ev);

  }

// ルーレット → すすむ → きっぷ
async function play(ev) {

    $('#card').hidden = true; V.cardOpen = false;
    led1(`${p.n}：発車！`); led2('');
    beep(SFX.go);
    await rollLed(ev.n);
    led2(`${ev.n}駅すすむ`);
    const N = bd(G);
    for (const id of ev.path) {
      V.pos[ev.p] = id; placeTokens(); follow(N[id], RM() ? 'auto' : 'smooth');
      if (!RM()) beep(SFX.hop);
      await sleep(RM() ? 0 : 230);
    }
  }
  V.pos[ev.p] = ev.at != null ? ev.at : G.pl[ev.p].pos;
  placeTokens();
  showCard(ev, false);
  const big = ev.fx.find(f => f[2] === 'win'), pay = ev.fx.find(f => f[2] === 'pay'), bad = ev.fx.find(f => f[1] < -49);
  beep(big ? SFX.win : pay ? SFX.pay : bad ? SFX.bad : null);

}

    pos[i] = { x: x0, y, w: W - x0 - 34 }; y += rowH;
    if (n.k === 'br' && n.lanes) {
      const ys = y - rowH, Lm = Math.max(...n.lanes.map(l => l.length)), span = (Lm + 1) * (W < 480 ? 76 : rowH);   // 2本ならぶところは、せまい画面だと字が2〜3行になるので すこし広く

        laneT.push({ x: li ? xB : x0, y: ys + gap * 0.5 + 2, line: FORKS[n.fork].o[li].line });
      });

    const d = a.x === b.x ? `M${a.x} ${a.y}L${b.x} ${b.y}` : `M${a.x} ${a.y}C${a.x} ${a.y + dy * 0.55},${b.x} ${b.y - dy * 0.55},${b.x} ${b.y}`;

  }).join('') + laneT.map(t => `<span class="lane-t" style="left:${t.x}px;top:${t.y}px;background:${LINES[t.line].c}">${LINES[t.line].n}</span>`).join('');

function updDock() {
  const b = $('#bFire');
  if (!G) { b.disabled = true; return; }
  if (G.ph === 'over') { led1('ぜんいん引退しました'); led2('けっか発表'); b.disabled = true; return; }
  const p = G.pl[G.turn], my = mine(G.turn);
  b.disabled = !(G.ph === 'spin' && my && !V.busy && !V.wait);
  if (V.busy) return;
  const who = p.k === 'cpu' ? `${p.n}（CPU）` : p.n;
  if (G.ph === 'spin' && G.ev && G.ev.ag && G.ev.p === G.turn) led1(`${who}：もう1回 発車！`);
  else led1(G.ph === 'pick' ? (my ? `${who}の番です` : `${who}が えらんでいます`) : `つぎは ${who}`);
  if (G.ph === 'spin') led2(my ? '「発車」をおすと ルーレットがまわります' : p.k === 'cpu' ? 'CPU が発車します' : `${p.n} が発車するのを待っています`);
  else led2(my ? 'きっぷから えらんでください' : 'えらぶのを待っています');
  const n = $('#ledNum'); if (G.ph === 'spin') { n.classList.add('idle'); n.textContent = '-'; }
}

function showCard(ev, quiet) {

    case 'ins': {

/* ================= ネット対戦（ホストがすすめる）=================
   ホスト：presence = {h:1, n, lob:{len, cpu, mem:[{peer,n}]}, g: ゲームの状態}
   ゲスト：presence = {n, a:{s, k, v}}（操作。ホストが番号 s の新しいものだけ使う） */
const NET = { room: null, code: '', host: false, peers: [], first: new Map(), seen: new Map(), aseq: 0, lob: null, off: null, gone: new Map(), lastHost: 0 };
const CODEC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function getRoomApi() {
  if (!(window.claude && typeof window.claude.use === 'function')) throw new Error('ネット対戦の部品が読みこめませんでした（ページを読みなおしてください）');
  return window.claude.use('room');
}
function myName() { return ((setup.seats[0] && setup.seats[0].n) || 'あなた').trim().slice(0, 12) || 'あなた'; }
async function hostCreate() {
  const code = Array.from({ length: 4 }, () => CODEC[Math.floor(Math.random() * CODEC.length)]).join('');
  await joinRoom(code, true);
}
async function joinRoom(code, host) {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  if (code.length !== 4) { toast('部屋番号は4文字です'); return; }
  leaveNet();
  toast('部屋につないでいます…', 8000);
  let api, room;
  try { api = await getRoomApi(); room = await api.join('js' + code.toLowerCase()); }
  catch (e) { toast(e && e.message ? e.message : 'つながりませんでした'); return; }
  $('#toast').hidden = true;
  NET.room = room; NET.code = code; NET.host = host; NET.first = new Map(); NET.seen = new Map(); NET.aseq = 0; NET.gone = new Map(); NET.lastHost = Date.now(); NET.t0 = Date.now(); NET.hostSeen = 0; NET.noHost = 0; NET.hostLob = null;
  V.mode = host ? 'host' : 'guest';
  const me = room.peers().find(p => p.isMe); V.myPeer = me ? me.peer : null;
  if (host) { NET.lob = { len: setup.len, cpu: 1 }; const L = lobState(); NET.lobJ = JSON.stringify(L); await room.presence({ h: 1, n: myName(), lob: L, g: null }); }
  else await room.presence({ n: myName(), a: null });
  NET.off = room.onPeers(({ peers }) => netPeers(peers));
  netPeers(room.peers());
  clearInterval(NET.tick); NET.tick = setInterval(netTick, 2000);
  if (host) hostLobby(); else guestLobby();
  try { history.replaceState(null, '', `?room=${code}`); } catch (e) {}
}
function leaveNet() {
  clearInterval(NET.tick);
  if (NET.off) { try { NET.off(); } catch (e) {} NET.off = null; }
  if (NET.room) { try { NET.room.leave(); } catch (e) {} NET.room = null; }
  NET.peers = []; NET.code = '';
  if (V.mode !== 'local') { V.mode = 'local'; V.myPeer = null; }
  if (/[?&]room=/.test(location.search)) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
}
// 部屋にいる人（ゲスト）。入った順
function guests() {
  return NET.peers.filter(p => !p.isMe && p.presence && !p.presence.h).map(p => { if (!NET.first.has(p.peer)) NET.first.set(p.peer, Date.now()); return p; })
    .sort((a, b) => NET.first.get(a.peer) - NET.first.get(b.peer));
}
function lobState() {
  const gs = guests().slice(0, 3);
  const cpu = Math.max(0, Math.min(NET.lob.cpu, 3 - gs.length));
  return { len: NET.lob.len, cpu, mem: [{ peer: V.myPeer, n: myName(), h: 1 }, ...gs.map(p => ({ peer: p.peer, n: String((p.presence && p.presence.n) || 'ゲスト').slice(0, 12) }))] };
}
// 部屋の設定（ホスト）：かわったときだけ流す。かわったら true
function lobPush() {
  if (!NET.room || !NET.host) return false;
  const L = lobState(), j = JSON.stringify(L);
  if (j === NET.lobJ) return false;
  NET.lobJ = j; NET.room.presence({ lob: L }); return true;
}
function netPeers(peers) {
  NET.peers = peers || [];
  if (!NET.room) return;
  if (NET.host) {
    if ((!G || $('#game').hidden && $('#result').hidden) && lobPush() && !$('#lobby').hidden) hostLobby();
    // ゲストの操作（ホストの G はいつも最新。うごきを見せている最中でも、すぐ使う）
    if (G && G.ph !== 'over') {
      for (const p of NET.peers) {
        if (p.isMe || !p.presence || !p.presence.a) continue;
        const a = p.presence.a, s = Number(a.s) || 0;
        if (s <= (NET.seen.get(p.peer) || 0)) continue;
        NET.seen.set(p.peer, s);
        if (a.g !== G.gid) continue;   // 前のゲームの操作
        const pi = G.pl.findIndex(q => q.k === 'net' && q.peer === p.peer);
        if (pi < 0 || pi !== G.turn) continue;
        if (act(G, pi, { k: a.k, v: a.v })) commit();
      }
    }
  } else {
    const h = NET.peers.find(p => !p.isMe && p.presence && p.presence.h);
    if (!h) return;
    NET.lastHost = Date.now(); NET.hostSeen = 1;
    const g = h.presence.g;
    if (g && Array.isArray(g.pl)) {
      if (g.ph === 'over' && V.dismissed === g.gid) { if (G) { G = null; V.q = null; } guestLobby(); return; }
      if (!G || G.gid !== g.gid || $('#game').hidden && $('#result').hidden) { V.mode = 'guest'; V.qv = g.ver; V.wait = 0; enterGame(g); }
      else if (g.ver > (V.qv || 0)) { V.qv = g.ver; V.wait = 0; onState(g); }
    } else {
      NET.hostLob = h.presence.lob;
      if (G) { clearTimeout(V.cpuT); G = null; V.q = null; }
      guestLobby();
    }
  }
}
// 2秒ごと：ぬけた人は CPU に（ホスト）・ホストがいなくなった（ゲスト）
function netTick() {
  if (!NET.room) return;
  const now = Date.now(), peers = NET.room.peers(), here = new Set(peers.map(p => p.peer));
  if (NET.host && G && G.ph !== 'over') {
    let ch = false;
    G.pl.forEach((p, i) => {
      if (p.k !== 'net') return;
      if (here.has(p.peer)) { NET.gone.delete(p.peer); return; }
      if (!NET.gone.has(p.peer)) NET.gone.set(p.peer, now);
      else if (now - NET.gone.get(p.peer) > 10000) { p.k = 'cpu'; log(G, i, `${p.n}：通信が切れたので CPU がかわります`); p.n = p.n + '（CPU）'; ch = true; }
    });
    if (ch) { G.ver++; commit(); }
  }
  if (!NET.host) {
    if (peers.some(p => !p.isMe && p.presence && p.presence.h)) NET.lastHost = now;
    if (NET.hostSeen && now - NET.lastHost > 10000) {
      toast('ホストとの通信が切れました。ホームにもどります', 4000);
      leaveNet(); G = null; show('home'); renderHome(); return;
    }
    if (!NET.hostSeen && now - NET.t0 > 9000 && !$('#lobby').hidden && !NET.noHost) { NET.noHost = 1; guestLobby(); }
  }
}
function netPush() { if (NET.room && NET.host) NET.room.presence({ g: G, lob: null }); }
function netAct(a) {
  if (!NET.room) return;
  NET.aseq = Math.max(Date.now(), NET.aseq + 1);
  NET.room.presence({ a: { s: NET.aseq, g: G.gid, k: a.k, v: a.v == null ? null : a.v } });
  V.wait = Date.now(); updDock();
  clearTimeout(V.waitT); V.waitT = setTimeout(() => { if (V.wait && Date.now() - V.wait >= 4000) { V.wait = 0; if (G) { updDock(); if (G.ph === 'pick' && G.ev) showCard(G.ev, true); } } }, 4100);
}
function lobHead() {
  return `<div class="ledbox"><div class="lt">部屋番号</div><div class="big">${esc(NET.code)}</div><div class="lt">友だちは「部屋に入る」に この番号を入れます</div></div>
    <button class="sub" type="button" id="bCopy">招待のリンクをコピー</button>`;
}

}
function hostLobby() {
  if (G) { clearTimeout(V.cpuT); G = null; V.q = null; if (NET.room) { const L = lobState(); NET.lobJ = JSON.stringify(L); NET.room.presence({ g: null, lob: L }); } }
  show('lobby');
  $('#barT').textContent = 'ネット対戦';
  const L = lobState(), n = L.mem.length + L.cpu;
  $('#lobIn').innerHTML = `${lobHead()}
    <section class="sec"><h2>あそぶ人（${n}人）</h2>
    ${L.mem.map((m, i) => `<div class="mem"><span class="tk" style="--pc:${PCOL[i]}">${i + 1}</span>${esc(m.n)}<small>${m.h ? 'ホスト（あなた）' : 'ネット'}</small></div>`).join('')}
    ${Array.from({ length: L.cpu }, (_, k) => `<div class="mem"><span class="tk" style="--pc:${PCOL[L.mem.length + k]}">${L.mem.length + k + 1}</span>${CPUN[k]}<small>CPU</small></div>`).join('')}
    <div class="cpuc"><span class="small">CPU</span><button type="button" id="cpuM" aria-label="CPU をへらす">−</button><b>${L.cpu}</b><button type="button" id="cpuP" aria-label="CPU をふやす">＋</button><span class="small muted">（4人まで）</span></div></section>
    <section class="sec"><h2>長さ</h2><div class="lens">${Object.entries(LENS).map(([k, x]) => `<button type="button" class="len" data-l="${k}" aria-pressed="${NET.lob.len === k}">${x.n}<small>${x.d}</small></button>`).join('')}</div></section>
    <button class="go" type="button" id="bGo" ${n < 2 ? 'disabled' : ''}>出発する</button>
    <p class="small muted" style="margin-top:10px">${n < 2 ? '2人から出発できます（CPU を入れるか、友だちを待つ）' : '友だちが入ったら、ここにならびます'}</p>
    <button class="sub" type="button" id="bLeave">部屋をとじる</button>`;
  bindCopy();
  $('#cpuM').onclick = () => { NET.lob.cpu = Math.max(0, NET.lob.cpu - 1); lobPush(); hostLobby(); };
  $('#cpuP').onclick = () => { NET.lob.cpu = Math.min(3, NET.lob.cpu + 1); lobPush(); hostLobby(); };
  $$('#lobIn [data-l]').forEach(b => b.onclick = () => { NET.lob.len = b.dataset.l; lobPush(); hostLobby(); });
  $('#bGo').onclick = () => {
    const L2 = lobState(); if (L2.mem.length + L2.cpu < 2) return;
    const seats = [{ k: 'hum', n: myName() }, ...L2.mem.slice(1).map(m => ({ k: 'net', n: m.n, peer: m.peer })), ...Array.from({ length: L2.cpu }, (_, k) => ({ k: 'cpu', n: CPUN[k] }))];
    NET.seen = new Map();
    for (const p of NET.peers) if (p.presence && p.presence.a) NET.seen.set(p.peer, Number(p.presence.a.s) || 0);   // 前の操作は使わない
    const g = newGame(seats, L2.len, true);
    G = null; enterGame(g); netPush();
  };
  $('#bLeave').onclick = () => { leaveNet(); show('home'); renderHome(); };
}
function guestLobby() {
  show('lobby');
  $('#barT').textContent = 'ネット対戦';
  const L = NET.hostLob;
  $('#lobIn').innerHTML = `${lobHead()}
    <section class="sec"><h2>あそぶ人</h2>${L ? L.mem.map((m, i) => `<div class="mem"><span class="tk" style="--pc:${PCOL[i]}">${i + 1}</span>${esc(m.n)}<small>${m.h ? 'ホスト' : m.peer === V.myPeer ? 'あなた' : 'ネット'}</small></div>`).join('')
      + Array.from({ length: L.cpu }, (_, k) => `<div class="mem"><span class="tk" style="--pc:${PCOL[L.mem.length + k]}">${L.mem.length + k + 1}</span>${CPUN[k]}<small>CPU</small></div>`).join('') : `<p class="muted">${NET.noHost ? 'この番号の部屋が見つかりません。番号をたしかめてください（ホストが部屋をつくってから入ります）' : NET.hostSeen ? 'ホストが つぎのゲームを用意するのを待っています…' : 'ホストをさがしています…'}</p>`}
    ${L && !L.mem.some(m => m.peer === V.myPeer) ? '<p class="small muted">満員なので、見学になります</p>' : ''}</section>
    <p class="small muted">${L ? `長さ：${LENS[L.len] ? LENS[L.len].n : ''}。ホストが出発するのを待っています` : ''}</p>
    <button class="sub" type="button" id="bLeave">部屋から ぬける</button>`;
  bindCopy();
  $('#bLeave').onclick = () => { leaveNet(); show('home'); renderHome(); };
}
$('#bHost').onclick = () => hostCreate();
$('#bJoin').onclick = () => joinRoom($('#codeIn').value, false);
$('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#bJoin').click(); });

/* ================= はじめ ================= */
$('#bRule').onclick = () => sheet('あそびかた', `<div class="rules" style="margin:0">${RULES}</div>`);
$('#bSnd').onclick = () => { SND = SND ? 0 : 1; LS.set('jinsei_snd', SND); sndBtn(); if (SND) beep(SFX.pay); };
sndBtn();
renderHome();
show('home');
{ const rc = (QS.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); if (rc.length === 4) { $('#codeIn').value = rc; $('#bJoin').scrollIntoView({ block: 'center' }); toast('部屋番号が入っています。「部屋に入る」をおしてください', 4000); } }
if (TEST) window.JS_T = { get G() { return G; }, V, act, cpuMove, newGame, boardFor, NET, startLocal, send, mine };
})();
