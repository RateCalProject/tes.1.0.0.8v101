<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="300">
<title>メンテナンス中｜空飛ぶエビフライ</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1f2328;--sub:#5d636a;--line:#e2dfd8;--accent:#2e7d57;--btn:#2e7d57;--btnink:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#141619;--card:#1d2024;--ink:#e8eaed;--sub:#a4aab1;--line:#2d3137;--accent:#6cc39b;--btn:#6cc39b;--btnink:#10231a}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 24px 24px;text-align:center}
svg{display:block;margin:0 auto 16px}
h1{font-size:20px;line-height:1.4;margin:0 0 6px}
.site{color:var(--sub);font-size:13px;margin:0 0 20px}
p{line-height:1.8;margin:0 0 12px;font-size:15px}
.when{display:inline-block;margin:4px 0 20px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--sub)}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:10px 20px;background:var(--btn);color:var(--btnink);cursor:pointer}
.note{color:var(--sub);font-size:12px;margin:12px 0 0}
.en{color:var(--sub);font-size:13px;margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42V22" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M24 24C24 14 17 9 8 9c0 10 7 15 16 15z" fill="var(--accent)" opacity=".85"/><path d="M24 22c0-8 6-12 14-12 0 8-6 12-14 12z" fill="var(--accent)"/></svg>
<h1>ただいまメンテナンス中です</h1>
<p class="site">空飛ぶエビフライ</p>
<p>風の芽経済組のメンテナンスのため、お休みしています。<br>終わりしだい再開します。</p>
<div class="when">10月26日 18:00 から</div>
<p><button type="button" onclick="location.reload()">もう一度読みこむ</button></p>
<p class="note">再開すると、このページは自動で切りかわります。</p>
<p class="en">Under maintenance. We'll be back soon.</p>
</main>
</body>
</html>
